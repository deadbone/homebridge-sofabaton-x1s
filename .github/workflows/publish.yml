name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable or beta version in package.json (latest or beta dist-tag)
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  pull-requests: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish-pr-alpha:
    name: Publish PR alpha
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm run verify:pack

      - name: Set alpha version
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const pkg = require('./package.json');
          const [core] = pkg.version.split('-');
          const [major, minor, patch] = core.split('.').map(Number);
          if ([major, minor, patch].some((part) => !Number.isInteger(part))) {
            throw new Error(`Unsupported package version: ${pkg.version}`);
          }
          const nextPatch = pkg.version.includes('-') ? `${major}.${minor}.${patch}` : `${major}.${minor}.${patch + 1}`;
          const alphaVersion = `${nextPatch}-alpha.pr.${process.env.PR_NUMBER}.${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_RUN_ATTEMPT}`;
          execFileSync('npm', ['version', alphaVersion, '--no-git-tag-version'], { stdio: 'inherit' });
          NODE
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Publish alpha
        run: npm publish --tag alpha --provenance

  publish-tag:
    name: Publish tag
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Check requested version
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (version !== process.env.REQUESTED_VERSION || !/^\d+\.\d+\.\d+(-beta\.\d+)?$/.test(version)) {
            throw new Error('Requested version must match the checked-out stable or beta version.');
          }
          NODE

      - name: Check tag matches package version
        if: github.event_name == 'push'
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v${TAG_VERSION} does not match package.json version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm run verify:pack

      - name: Publish
        env:
          PUBLISH_EVENT: ${{ github.event_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PUBLISH_EVENT" == "workflow_dispatch" && "$PACKAGE_VERSION" == *-beta.* ]]; then
            npm publish --tag beta --provenance
          elif [[ "$PACKAGE_VERSION" == *-* ]]; then
            npm publish --tag alpha --provenance
          else
            npm publish --provenance
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --latest
          fi
